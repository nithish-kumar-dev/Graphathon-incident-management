[project]
name = "graphathon"
version = "0.1.0"
description = "Graph-grounded incident investigation (synthetic NovaCommerce demo)"
requires-python = ">=3.13,<3.15"
dependencies = [
    "falkordb>=1.8,<1.9",
    "langgraph>=1.2.16,<1.3",
    "langgraph-checkpoint-postgres>=3.2,<3.3",
    "psycopg[binary,pool]>=3.3,<3.4",
    "fastapi>=0.143,<0.144",
    "pydantic>=2.14,<3",
    "pydantic-settings>=2.6,<3",
    "uvicorn>=0.30,<1",
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["apps/api"]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs docker compose services running"]

[tool.ruff]
line-length = 110
