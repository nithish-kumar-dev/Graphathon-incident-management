# Local dev databases. Ports are bound to loopback only.
# Host Postgres.app on :5432 holds unrelated DBs. This project never uses it.
name: graphathon

services:
  falkordb:
    image: falkordb/falkordb:v4.22.0
    ports:
      - "127.0.0.1:${FALKORDB_HOST_PORT:-56379}:6379"
    environment:
      # AOF (fsync every second) + RDB preamble. Do NOT drop unique constraints or delete
      # constrained graphs on this server: FalkorDB 4.22.x then segfaults on AOF replay
      # (docs/schema/falkordb.md, "Known server issue").
      REDIS_ARGS: "--appendonly yes --appendfsync everysec"
      BROWSER: "0"   # the image otherwise starts the FalkorDB Browser (Next.js) inside the container
    volumes:
      - falkordb_data:/var/lib/falkordb/data
    healthcheck:
      test: ["CMD", "redis-cli", "PING"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # Ephemeral server for the test suite: no AOF, no snapshots, no volume. Tests create and
  # delete constrained graphs, which must never happen on the persistent server above.
  falkordb-test:
    image: falkordb/falkordb:v4.22.0
    ports:
      - "127.0.0.1:${FALKORDB_TEST_HOST_PORT:-56390}:6379"
    environment:
      REDIS_ARGS: "--appendonly no --save ''"
      BROWSER: "0"
    tmpfs:
      - /var/lib/falkordb/data
    healthcheck:
      test: ["CMD", "redis-cli", "PING"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  postgres:
    image: postgres:15-bookworm
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-55432}:5432"
    environment:
      POSTGRES_DB: graphathon
      POSTGRES_USER: ${POSTGRES_USER:-graphathon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d graphathon"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  falkordb_data:
  pg_data:
